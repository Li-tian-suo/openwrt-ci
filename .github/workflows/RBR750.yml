name: Build RBR750

on:
  workflow_dispatch:
  schedule:
    - cron: 0 19 * * *

env:
  REPO_URL: https://github.com/LiBwrt/LibWrt.git
  REPO_BRANCH: main-nss
  CONFIG_FILE: configs/rbr750.config
  CACHE_TOOLCHAIN: true
  FIRMWARE_RELEASE: true
  FIRMWARE_TAG: RBR750
  TZ: Asia/Shanghai

jobs:
  Build:
    runs-on: ubuntu-22.04

    steps:
      - name: Init Environment
        run: |
          if [ -n "$(docker images -q)" ]; then docker rmi $(docker images -q) || true; fi
          sudo apt-get -y update
          sudo apt-get -y install $(curl -fsSL is.gd/depends_ubuntu_2204)
          sudo timedatectl set-timezone "$TZ"

      - name: Checkout
        uses: actions/checkout@main

      - name: Clone Source
        run: |
          git clone $REPO_URL -b $REPO_BRANCH openwrt
          echo "OPENWRT_PATH=$PWD/openwrt" >> $GITHUB_ENV

      - name: Generate Config
        run: |
          cp $CONFIG_FILE $OPENWRT_PATH/.config
          cd $OPENWRT_PATH
          make defconfig

      - name: Cache Toolchain
        if: env.CACHE_TOOLCHAIN == 'true'
        uses: HiGarfield/cachewrtbuild@main
        with:
          ccache: false
          mixkey: ${{ env.REPO_URL }}-${{ env.REPO_BRANCH }}
          prefix: ${{ env.OPENWRT_PATH }}

      - name: Update Feeds
        run: |
          cd $OPENWRT_PATH
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Download Packages
        run: |
          cd $OPENWRT_PATH
          make download -j8

      - name: Compile
        id: compile
        run: |
          cd $OPENWRT_PATH
          make -j$(nproc) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Organize Files
        if: steps.compile.outputs.status == 'success'
        run: |
          cd $OPENWRT_PATH/bin/targets/qualcommax/ipq807x/
          rm -f *.manifest *.json *.buildinfo
          gzip -f *.bin *.itb || true
          sha256sum * > sha256sums.txt

      - name: Release Firmware
        if: steps.compile.outputs.status == 'success'
        uses: ncipollo/release-action@main
        with:
          allowUpdates: true
          tag: ${{ env.FIRMWARE_TAG }}
          artifacts: ${{ env.OPENWRT_PATH }}/bin/targets/qualcommax/ipq807x/*
          body: |
            RBR750 固件编译完成
            源码: ${{ env.REPO_URL }} (${{ env.REPO_BRANCH }})
          token: ${{ secrets.GITHUB_TOKEN }}
